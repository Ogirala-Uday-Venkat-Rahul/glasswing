<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181a22"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6bc63"/>
      <stop offset="100%" stop-color="#f0a63d"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0a63d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0a63d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0a63d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Amber Ambient Glow -->
  <circle cx="256" cy="270" r="180" fill="url(#glow)"/>

  <!-- Mascot (scaled 3.6x, centered at 256, 260) -->
  <g transform="translate(76, 80) scale(3.6)">
    <!-- Left Wing -->
    <path
      d="M50 52 C30 30 8 34 6 54 C24 51 40 51 50 52Z"
      fill="url(#wing)"
      fill-opacity="0.35"
      stroke="url(#wing)"
      stroke-width="3"
    />
    <!-- Right Wing -->
    <path
      d="M50 52 C70 30 92 34 94 54 C76 51 60 51 50 52Z"
      fill="url(#wing)"
      fill-opacity="0.35"
      stroke="url(#wing)"
      stroke-width="3"
    />
    <!-- Glowing Core -->
    <circle cx="50" cy="53" r="12" fill="url(#core)"/>
    <circle cx="50" cy="53" r="12" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.5"/>
  </g>
</svg>